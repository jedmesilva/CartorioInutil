openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cartorio
    description: Carimbos de documentos do cartório fictício
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /carimbar:
    post:
      operationId: carimbarArquivo
      tags: [cartorio]
      summary: Carimba um PDF ou imagem
      description: Aplica o selo humorístico do cartório a um arquivo enviado pelo usuário. O arquivo é processado temporariamente e não é armazenado.
      parameters:
        - in: header
          name: X-Progress-ID
          required: false
          description: Identificador usado para acompanhar as atualizações do processamento por SSE.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CarimboArquivoInput"
      responses:
        "200":
          description: Arquivo carimbado
          headers:
            Content-Disposition:
              description: Nome sugerido para baixar o arquivo carimbado
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "400":
          description: Arquivo ausente ou envio inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarimboErro"
        "413":
          description: Arquivo maior que 15 MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarimboErro"
        "415":
          description: Formato não suportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarimboErro"
        "422":
          description: Arquivo protegido, corrompido ou impossível de processar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarimboErro"
  /carimbar/progresso/{progressId}:
    get:
      operationId: acompanharProgressoCarimbo
      tags: [cartorio]
      summary: Acompanha o processamento do carimbo
      description: Mantém uma conexão SSE aberta e envia atualizações do processamento em JSON.
      parameters:
        - in: path
          name: progressId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fluxo de eventos; cada evento contém um objeto CarimboProgressoEvento.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Identificador de progresso inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarimboErro"
components:
  schemas:
    CarimboArquivoInput:
      type: object
      properties:
        arquivo:
          type: string
          format: binary
      required:
        - arquivo
    CarimboErro:
      type: object
      properties:
        erro:
          type: string
      required:
        - erro
    CarimboProgressoEvento:
      type: object
      properties:
        fase:
          type: string
          enum: [processando, concluido, erro]
        mensagem:
          type: string
        paginaAtual:
          type: integer
          minimum: 1
        totalPaginas:
          type: integer
          minimum: 1
      required:
        - fase
        - mensagem
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

